# Ejecuta las pruebas automáticas en cada cambio.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Simulación de partidas
        run: npm run test:sim
      - name: Partidas en línea entre navegadores
        run: npm run test:online
