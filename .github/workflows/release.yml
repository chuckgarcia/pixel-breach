# Crea la etiqueta vX.Y.Z y la "Release" en GitHub cada vez que cambia VERSION en index.html.
name: Publicar versión
on:
  push:
    branches: [main]
    paths: [index.html, CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Leer versión
        id: v
        run: |
          VER=$(grep -oP "const VERSION='\K[0-9]+\.[0-9]+\.[0-9]+" index.html)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - name: Notas de la versión (sección del CHANGELOG)
        if: steps.v.outputs.exists != '1'
        run: |
          awk -v v="${{ steps.v.outputs.ver }}" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Jugar: https://chuckgarcia.github.io/pixel-breach/" >> notes.md
      - name: Crear etiqueta y release
        if: steps.v.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.ver }}" --target "$GITHUB_SHA" --title "Pixel Breach v${{ steps.v.outputs.ver }}" --notes-file notes.md
